    <!-- ✅ Critical CSS inline -->
    <style>
      /* Critical CSS for above-the-fold content */
      .first-section-home {
        position: relative;
        width: 100%;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      
      .bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        pointer-events: none;
      }
      
      .first-section-home-content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
      .first-section-title {
        font-weight: 600;
        font-size: 55px;
        letter-spacing: 0.5px;
        text-align: center;
        color: #FFFBFB;
      }
      
      .first-section-description {
        font-weight: 500;
        font-size: 15px;
        line-height: 24px;
        letter-spacing: 0.3px;
        text-align: center;
        color: #E8E8E8;
        max-width: 631px;
        margin: 0.6rem 0px 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .build-together {
        min-width: 231px;
        min-height: 47px;
        border-radius: 10px;
        gap: 10px;
        background: #FFFFFF;
        color: var(--button-color);
        font-weight: 600;
        font-size: 14px;
        line-height: 23.44px;
        letter-spacing: 0.5px;
        box-shadow: 3px 4px 4px 0px #B2B2B240;
        padding: 7px 17px 6px;
      }
      
      .build-together:hover {
        color: #FFFFFF;
        background-color: var(--button-color);
      }
      
      /* Prevent layout shift */
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      /* Loading state to prevent CLS */
      .loading-placeholder {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
